version: '3.8'

services:
  campusswap:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: campusswap_app
    restart: always
    ports:
      - "5050:5050"
    environment:
      - NODE_ENV=production
      - PORT=5050
      - JWT_SECRET=${JWT_SECRET:-dyp_campus_swap_super_secret_jwt_key_2024}
      - DATABASE_URL=file:/app/backend/prisma/dev.db
      - ALLOWED_EMAIL_DOMAINS=dypvp.edu.in,dit@dypvp.edu.in,college.edu
    volumes:
      - campusswap_data:/app/backend/prisma
      - campusswap_uploads:/app/backend/uploads
      - campusswap_logs:/app/logs

volumes:
  campusswap_data:
  campusswap_uploads:
  campusswap_logs:
